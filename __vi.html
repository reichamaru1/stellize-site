<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8">
<link rel="stylesheet" href="css/style.css?v=20260906">
<style>body{padding:40px;background:#fff} .mission-items{grid-template-columns:repeat(3,1fr);gap:40px}
.mission-illust{width:300px !important} .mission-item{text-align:center}
.stagger,.stagger>*,.reveal{opacity:1 !important;transform:none !important}</style>
</head><body><div class="mission"><div class="mission-items stagger">

              <div class="mission-item hover-float">
                <div class="mission-illust" aria-hidden="true">
                  <svg viewBox="0 0 120 120" role="presentation">
                    <defs>
                      <radialGradient id="mi1" cx="50%" cy="42%" r="60%">
                        <stop offset="0%" stop-color="#EFE9F7"/><stop offset="100%" stop-color="#EFE9F7" stop-opacity="0"/>
                      </radialGradient>
                    </defs>
                    <circle cx="60" cy="58" r="46" fill="url(#mi1)"/>
                    <circle cx="60" cy="38" r="13" class="ln"/>
                    <path d="M28 102c0-17.7 14.3-32 32-32s32 14.3 32 32" class="ln"/>
                    <g class="sp" transform="translate(60,90) scale(0.8) translate(-12,-12)">
                      <path d="M12 2c.5 5.5 4.5 9.5 10 10-5.5.5-9.5 4.5-10 10-.5-5.5-4.5-9.5-10-10 5.5-.5 9.5-4.5 10-10z"/>
                    </g>
                  </svg>
                </div>
                <p class="mission-num">01</p>
                <h4>誰もが、真価を持っている</h4>
                <p>障害の有無でも、才能の差でもない。</p>
              </div>

              <div class="mission-item hover-float">
                <div class="mission-illust" aria-hidden="true">
                  <svg viewBox="0 0 120 120" role="presentation">
                    <defs>
                      <radialGradient id="mi2" cx="50%" cy="42%" r="60%">
                        <stop offset="0%" stop-color="#EFE9F7"/><stop offset="100%" stop-color="#EFE9F7" stop-opacity="0"/>
                      </radialGradient>
                    </defs>
                    <circle cx="60" cy="58" r="46" fill="url(#mi2)"/>
                    <path d="M20 96h22V78h22V60h22" class="ln"/>
                    <circle cx="86" cy="44" r="8" class="ln"/>
                    <path d="M74 60c0-6.6 5.4-12 12-12s12 5.4 12 12" class="ln"/>
                    <g class="sp" transform="translate(86,20) scale(0.55) translate(-12,-12)">
                      <path d="M12 2c.5 5.5 4.5 9.5 10 10-5.5.5-9.5 4.5-10 10-.5-5.5-4.5-9.5-10-10 5.5-.5 9.5-4.5 10-10z"/>
                    </g>
                  </svg>
                </div>
                <p class="mission-num">02</p>
                <h4>舞台は、自分でつくれる</h4>
                <p>スキルと、挑戦する一歩があれば。</p>
              </div>

              <div class="mission-item hover-float">
                <div class="mission-illust" aria-hidden="true">
                  <svg viewBox="0 0 120 120" role="presentation">
                    <defs>
                      <radialGradient id="mi3" cx="50%" cy="46%" r="60%">
                        <stop offset="0%" stop-color="#EFE9F7"/><stop offset="100%" stop-color="#EFE9F7" stop-opacity="0"/>
                      </radialGradient>
                    </defs>
                    <circle cx="60" cy="60" r="46" fill="url(#mi3)"/>
                    <circle cx="60" cy="60" r="25" class="ln" opacity=".4"/>
                    <circle cx="60" cy="60" r="38" class="ln" opacity=".28" stroke-dasharray="5 7"/>
                    <circle cx="60.0" cy="12.0" r="3.6" class="dot"/>
                    <circle cx="105.7" cy="45.2" r="3.6" class="dot"/>
                    <circle cx="88.2" cy="98.8" r="3.6" class="dot"/>
                    <circle cx="31.8" cy="98.8" r="3.6" class="dot"/>
                    <circle cx="14.3" cy="45.2" r="3.6" class="dot"/>
                    <g class="sp" transform="translate(60,60) scale(0.95) translate(-12,-12)">
                      <path d="M12 2c.5 5.5 4.5 9.5 10 10-5.5.5-9.5 4.5-10 10-.5-5.5-4.5-9.5-10-10 5.5-.5 9.5-4.5 10-10z"/>
                    </g>
                  </svg>
                </div>
                <p class="mission-num">03</p>
                <h4>「できる」が、社会の力になる</h4>
                <p>咲いた価値は、まわりを照らす。</p>
              </div>

            </div></div></body></html>
