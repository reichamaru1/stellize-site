<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<style>
  body { margin:0; padding:20px 22px; font-family:'Hiragino Kaku Gothic ProN','Yu Gothic Medium',Meiryo,sans-serif;
         font-size:12.5px; line-height:1.85; color:#3A3A3A; }
  h1 { margin:0 0 4px; font-size:15px; color:#1F2A54; font-weight:600; }
  p.lead { margin:0 0 14px; font-size:11.5px; color:#7A7368; }
  textarea { width:100%; box-sizing:border-box; height:170px; padding:10px; font:11.5px/1.7 ui-monospace,'SF Mono',Menlo,monospace;
             border:1px solid #E2DACD; border-radius:6px; resize:vertical; }
  label { display:block; margin:12px 0 3px; font-size:11px; font-weight:600; color:#5C564D; }
  input, select { width:100%; box-sizing:border-box; padding:7px 9px; font-size:12px; font-family:inherit;
                  border:1px solid #E2DACD; border-radius:5px; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:0 14px; }
  button { margin-top:16px; padding:10px 26px; font-size:12.5px; font-weight:600; font-family:inherit;
           background:#1F2A54; color:#fff; border:0; border-radius:5px; cursor:pointer; }
  button:disabled { opacity:.4; }
  .note { margin-top:10px; padding:10px 12px; background:#FAF7F2; border-radius:6px; font-size:11px; line-height:1.85; color:#5C564D; }
  .msg { margin-top:12px; padding:10px 12px; border-radius:5px; font-size:12px; white-space:pre-wrap; }
  .ok { background:#EDF2F0; color:#3E5A4C; } .err { background:#FBEFF3; color:#8A3A54; }
  code { background:#F0EBE3; padding:1px 4px; border-radius:3px; font-size:11px; }
</style>
</head>
<body>

<h1>購読者をまとめて取り込む</h1>
<p class="lead">スプレッドシートやCSVからコピーして、そのまま貼り付けてください。1行目は見出し行です。</p>

<textarea id="text" placeholder="メールアドレス&#9;事業所名&#9;宛名&#9;都道府県&#10;info@example.jp&#9;○○就労支援センター&#9;佐藤&#9;神奈川県"></textarea>

<div class="note">
  使える見出し： <code>メールアドレス</code>（必須） / <code>宛名</code> / <code>法人名</code> / <code>事業所名</code> /
  <code>都道府県</code> / <code>セグメント</code><br>
  すでに登録済みのアドレスと、配信停止済みのアドレスは自動で除きます。
</div>

<div class="grid">
  <div>
    <label>セグメント（空欄なら貼り付けた値のまま）</label>
    <input id="segment" placeholder="例： 事業所, 神奈川">
  </div>
  <div>
    <label>状態</label>
    <select id="state">
      <option value="購読中">購読中（すぐ配信対象になる）</option>
      <option value="保留">保留（あとで確認してから）</option>
    </select>
  </div>
  <div>
    <label>取得元</label>
    <input id="source" value="CSV取り込み">
  </div>
  <div>
    <label>許諾の根拠</label>
    <input id="basis" placeholder="例： 公式サイトに公開されている法人の連絡先">
  </div>
</div>

<div class="note">
  <strong>許諾の根拠は必ず埋めてください。</strong>
  特定電子メール法では、広告・宣伝を含むメールを送るには原則として事前の同意が要ります。
  法人が自らサイト等で公開している連絡先への事業のご案内は同意なしで送れますが、
  「どこで公開されていたか」を記録に残しておく必要があります。
</div>

<button id="go" onclick="run()">取り込む</button>
<div id="msg"></div>

<script>
  function run() {
    var t = document.getElementById('text').value.trim();
    if (!t) { msg('err', '貼り付ける内容がありません。'); return; }
    document.getElementById('go').disabled = true;
    msg('ok', '取り込んでいます…');
    google.script.run
      .withSuccessHandler(function (r) {
        document.getElementById('go').disabled = false;
        msg('ok', '追加 ' + r.added + ' 件\n重複でスキップ ' + r.dup + ' 件\n配信停止済みでスキップ '
          + r.suppressed + ' 件\nアドレスの形式が不正 ' + r.invalid + ' 件');
      })
      .withFailureHandler(function (e) {
        document.getElementById('go').disabled = false;
        msg('err', e.message);
      })
      .uiImport(t, {
        segment: document.getElementById('segment').value.trim(),
        state:   document.getElementById('state').value,
        source:  document.getElementById('source').value.trim(),
        basis:   document.getElementById('basis').value.trim(),
      });
  }
  function msg(cls, text) {
    document.getElementById('msg').className = 'msg ' + cls;
    document.getElementById('msg').textContent = text;
  }
</script>
</body>
</html>
