<!--
  日刊の骨格。

  営業レター（base.html）とは目的が違うので、骨格から分けている。
    ・毎日届くものなので、飾りは邪魔になる。ロゴは小さく、タグラインは出さない
    ・ヒーロー画像もCTA帯も使わない。売り込みは月1の営業レターに任せる
    ・そのぶん本文の行間を広く取る（1.5行分）。読み物として最後まで読ませるため
    ・号数と日付を上に出す。毎日届くものは「いつのか」が分かることが親切

  メールクライアント対策は base.html と同じ制約に従う（理由もそちらに書いてある）。
-->
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" lang="ja">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="x-apple-disable-message-reformatting" />
<meta name="color-scheme" content="light" />
<meta name="supported-color-schemes" content="light" />
<title>{{SUBJECT}}</title>
<!--[if mso]>
<xml><o:OfficeDocumentSettings><o:PixelsPerInch>96</o:PixelsPerInch></o:OfficeDocumentSettings></xml>
<![endif]-->
<style type="text/css">
  table, td { mso-table-lspace:0pt; mso-table-rspace:0pt; }
  img { -ms-interpolation-mode:bicubic; border:0; outline:none; text-decoration:none; }
  body { margin:0; padding:0; width:100% !important; -webkit-text-size-adjust:100%; -ms-text-size-adjust:100%; }
  a[x-apple-data-detectors] { color:inherit !important; text-decoration:none !important; font-size:inherit !important; font-family:inherit !important; font-weight:inherit !important; line-height:inherit !important; }

  @media only screen and (max-width:620px) {
    .sl-wrap  { width:100% !important; }
    .sl-pad   { padding-left:24px !important; padding-right:24px !important; }
    .sl-h1    { font-size:21px !important; line-height:1.7 !important; }
    .sl-h2    { font-size:18px !important; }
    .sl-state { font-size:18px !important; line-height:1.9 !important; }
    .sl-lead  { font-size:15.5px !important; }
    .sl-num   { font-size:28px !important; }
    .sl-btn a { display:block !important; padding-left:16px !important; padding-right:16px !important; }
    .sl-stack { display:block !important; width:100% !important; max-width:100% !important; }
    .sl-logo img { width:104px !important; height:auto !important; }
    .sl-spec-key { width:82px !important; }
    .sl-voice-img { width:52px !important; }
    .sl-dateline { display:block !important; padding-top:6px !important; text-align:left !important; }
  }

  [data-ogsc] .sl-card  { background:#FFFFFF !important; }
  [data-ogsc] .sl-cream { background:#FAF7F2 !important; }
  [data-ogsc] .sl-text  { color:#3A3A3A !important; }
  [data-ogsc] .sl-title { color:{{ACCENT}} !important; }
</style>
</head>
<body style="margin:0; padding:0; background-color:#F2EDE5;">

<div style="display:none; font-size:1px; color:#F2EDE5; line-height:1px; max-height:0; max-width:0; opacity:0; overflow:hidden; mso-hide:all;">{{PREHEADER}}</div>
<div style="display:none; font-size:1px; color:#F2EDE5; line-height:1px; max-height:0; max-width:0; opacity:0; overflow:hidden; mso-hide:all;">&#8199;&#65279;&#847;&#8199;&#65279;&#847;&#8199;&#65279;&#847;&#8199;&#65279;&#847;&#8199;&#65279;&#847;&#8199;&#65279;&#847;&#8199;&#65279;&#847;&#8199;&#65279;&#847;&#8199;&#65279;&#847;&#8199;&#65279;&#847;</div>

<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#F2EDE5;">
  <tr>
    <td align="center" style="padding:22px 12px 40px 12px;">

      <!--[if mso]><table role="presentation" width="580" cellpadding="0" cellspacing="0" border="0"><tr><td><![endif]-->
      <table role="presentation" class="sl-wrap" width="580" cellpadding="0" cellspacing="0" border="0" style="width:580px; max-width:580px; margin:0 auto;">

        <!-- 題字。ロゴを小さく、左に。右に号と日付 -->
        <tr>
          <td style="padding:0 4px 14px 4px;">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
              <tr>
                <td class="sl-logo" valign="middle" align="left" style="padding:0;">
                  <a href="{{SITE_URL}}" style="text-decoration:none;"><img src="{{LOGO_URL}}" width="118" height="28" alt="Stellize" style="display:block; width:118px; height:auto; border:0; font-family:'Hiragino Mincho ProN','Yu Mincho',serif; font-size:15px; letter-spacing:0.12em; color:#1F2A54; text-decoration:none;" /></a>
                </td>
                <td class="sl-dateline" valign="middle" align="right" style="font-family:'Hiragino Kaku Gothic ProN','Hiragino Sans','Yu Gothic Medium',Meiryo,sans-serif; font-size:10.5px; letter-spacing:0.1em; color:#9A9184;">
                  {{DATELINE}}
                </td>
              </tr>
            </table>
          </td>
        </tr>

        <!-- 本体 -->
        <tr>
          <td class="sl-card" style="background-color:#FFFFFF; border-radius:12px; overflow:hidden;">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="border-radius:12px; overflow:hidden;">

              <tr><td style="height:3px; line-height:3px; font-size:0; background-color:{{ACCENT}};">&nbsp;</td></tr>

              <tr>
                <td class="sl-pad" style="padding:34px 44px 0 44px;">
                  <p style="margin:0 0 12px 0; font-family:'Hiragino Kaku Gothic ProN','Hiragino Sans','Yu Gothic Medium',Meiryo,sans-serif; font-size:10px; letter-spacing:0.22em; color:#9A7F4E; text-indent:0.22em;">{{EYEBROW}}</p>
                  <h1 class="sl-h1 sl-title" style="margin:0; font-family:'Hiragino Mincho ProN','Yu Mincho','YuMincho','MS PMincho',serif; font-size:24px; line-height:1.78; font-weight:600; letter-spacing:0.045em; color:{{ACCENT}};">{{TITLE}}</h1>
                </td>
              </tr>
              <tr>
                <td class="sl-pad" style="padding:20px 44px 6px 44px;">
                  <table role="presentation" cellpadding="0" cellspacing="0" border="0"><tr><td style="width:40px; height:2px; line-height:2px; font-size:0; background-color:#C0A16B;">&nbsp;</td></tr></table>
                </td>
              </tr>

              {{HERO}}
              {{BODY}}

              <tr><td style="height:16px; line-height:16px; font-size:0;">&nbsp;</td></tr>
            </table>
          </td>
        </tr>

        <!-- フッター。毎日届くので短く。ただし法令上必要な項目は落とさない
             ・送信者の名称 ・住所 ・問い合わせ受付先 ・受信拒否の通知先 -->
        <tr>
          <td class="sl-pad" style="padding:24px 44px 0 44px; font-family:'Hiragino Kaku Gothic ProN','Hiragino Sans','Yu Gothic Medium',Meiryo,sans-serif; font-size:11.5px; line-height:1.9; color:#8A8072;">
            {{FOOTER_NOTE}}
            <p style="margin:0 0 3px 0;">{{COMPANY}}　{{ADDRESS}}</p>
            <p style="margin:0 0 12px 0;"><a href="{{SITE_URL}}" style="color:{{ACCENT_DEEP}}; text-decoration:underline;">{{SITE_URL_LABEL}}</a>　|　<a href="{{CONTACT_URL}}" style="color:{{ACCENT_DEEP}}; text-decoration:underline;">お問い合わせ</a>　|　<a href="{{PRIVACY_URL}}" style="color:{{ACCENT_DEEP}}; text-decoration:underline;">プライバシーポリシー</a></p>
            <p style="margin:0 0 3px 0; font-size:10.5px; line-height:1.8; color:#A39B8F;">{{PERMISSION_NOTE}}</p>
            <p style="margin:0 0 16px 0; font-size:10.5px;">{{WEBVIEW}}　<a href="{{UNSUB_URL}}" style="color:#A39B8F; text-decoration:underline;">配信を停止する</a></p>
            <p style="margin:0 0 6px 0; font-size:10px; letter-spacing:0.06em; color:#B8B0A3;">&copy; {{YEAR}} Stellize.</p>
          </td>
        </tr>

      </table>
      <!--[if mso]></td></tr></table><![endif]-->

    </td>
  </tr>
</table>
{{TRACKING}}
</body>
</html>
